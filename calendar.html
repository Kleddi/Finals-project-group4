<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar - Campus Event &amp; Club Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="calendar">
  <header>
    <h1>Campus Event &amp; Club Hub</h1>
    <p>Group members: (add your names here)</p>
    <nav>
      <a href="index.html">Home</a>
      <a href="events.html">Events</a>
      <a href="calendar.html" aria-current="page">Calendar</a>
      <a href="bookmarks.html">Bookmarks</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Calendar</h2>
      <div class="month-bar">
        <button id="prev-month" aria-label="Previous month">&larr; Prev</button>
        <h3 id="month-title"></h3>
        <button id="next-month" aria-label="Next month">Next &rarr;</button>
      </div>
      <div id="calendar-grid"></div>
      <p class="legend">
        <span class="dot cat-Academic"></span> Academic
        <span class="dot cat-Social"></span> Social
        <span class="dot cat-Sports"></span> Sports
      </p>
      <div id="day-events" class="cards" aria-live="polite"></div>
    </section>
  </main>

  <footer>
    <p>Built for the finals project.</p>
  </footer>

  <script src="events.js"></script>
  <script src="script.js"></script>
</body>
</html>
